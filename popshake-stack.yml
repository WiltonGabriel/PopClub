version: "3.8"

services:
  popshake-app:
    image: ${IMAGE_NAME:-ghcr.io/wiltongabriel/popclub}:${IMAGE_TAG:-latest}
    container_name: popshake-app
    restart: unless-stopped

    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
      - NEXT_PUBLIC_STORE_PHONE=${NEXT_PUBLIC_STORE_PHONE:-5581999999999}
      - NEXT_PUBLIC_STORE_NAME=${NEXT_PUBLIC_STORE_NAME:-Pop Shake Sorveteria}

    volumes:
      - popshake_uploads:/app/public/uploads

    networks:
      - proxy_network

    labels:
      # Habilita o Traefik para rotear o tráfego para este serviço
      - "traefik.enable=true"
      - "traefik.docker.network=proxy_network"

      # Roteador HTTPS Seguro (websecure)
      - "traefik.http.routers.popshake.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.popshake.entrypoints=websecure"
      - "traefik.http.routers.popshake.tls=true"
      - "traefik.http.routers.popshake.tls.certresolver=leresolver"

      # Porta interna do container standalone do Next.js
      - "traefik.http.services.popshake.loadbalancer.server.port=3000"

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  popshake_uploads:
    name: popshake_uploads

networks:
  proxy_network:
    external: true
