services:
  db:
    image: postgres:16-alpine
    container_name: popshake_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - popshake_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - popshake_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: popshake_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      JWT_SECRET: ${JWT_SECRET:-${NEXTAUTH_SECRET:-popclub_secret_jwt_key_2026_super_secure}}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-${JWT_SECRET:-popclub_secret_jwt_key_2026_super_secure}}
      NEXTAUTH_URL: https://${APP_DOMAIN}
      NEXT_PUBLIC_APP_URL: https://${APP_DOMAIN}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    networks:
      - popshake_internal
      - proxy_network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy_network"
      # Roteador público prioritário (sem Authelia)
      - "traefik.http.routers.popshake-public.rule=Host(`${APP_DOMAIN}`) && (Path(`/manifest.webmanifest`) || PathPrefix(`/_next/static/`) || Path(`/favicon.ico`))"
      - "traefik.http.routers.popshake-public.entrypoints=websecure"
      - "traefik.http.routers.popshake-public.tls.certresolver=leresolver"
      - "traefik.http.routers.popshake-public.priority=100"
      - "traefik.http.routers.popshake-public.service=popshake-dev"
      # Roteador principal com Authelia
      - "traefik.http.routers.popshake-dev.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.popshake-dev.entrypoints=websecure"
      - "traefik.http.routers.popshake-dev.tls.certresolver=leresolver"
      - "traefik.http.routers.popshake-dev.middlewares=authelia@docker"
      - "traefik.http.routers.popshake-dev.priority=1"
      - "traefik.http.routers.popshake-dev.service=popshake-dev"
      # Serviço compartilhado
      - "traefik.http.services.popshake-dev.loadbalancer.server.port=3000"

networks:
  proxy_network:
    external: true
  popshake_internal:
    driver: bridge

volumes:
  popshake_db_data:
