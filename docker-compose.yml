services:
  db:
    image: postgres:16-alpine
    container_name: popshake_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - popshake_db_data:/var/lib/postgresql/data
    networks:
      - popshake_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: popshake_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      JWT_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: https://${APP_DOMAIN}
      NEXT_PUBLIC_APP_URL: https://${APP_DOMAIN}
    networks:
      - popshake_internal
      - proxy_network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy_network"
      - "traefik.http.routers.popshake-dev.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.popshake-dev.entrypoints=websecure"
      - "traefik.http.routers.popshake-dev.tls.certresolver=leresolver"
      - "traefik.http.routers.popshake-dev.middlewares=authelia@docker"
      - "traefik.http.services.popshake-dev.loadbalancer.server.port=3000"

networks:
  proxy_network:
    external: true
  popshake_internal:
    driver: bridge

volumes:
  popshake_db_data:
