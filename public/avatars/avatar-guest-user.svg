<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="guest-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="guest-silhouette" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>
  <!-- Outer border ring -->
  <circle cx="50" cy="50" r="48" fill="url(#guest-bg)" stroke="#CBD5E1" stroke-width="2" />
  <!-- Inner circular clip for silhouette -->
  <g clip-path="url(#guest-clip)">
    <clipPath id="guest-clip">
      <circle cx="50" cy="50" r="46" />
    </clipPath>
    <!-- Neutral Human Silhouette: Head -->
    <circle cx="50" cy="38" r="17" fill="url(#guest-silhouette)" />
    <!-- Neutral Human Silhouette: Shoulders / Torso -->
    <path d="M18,92 C18,72 32,63 50,63 C68,63 82,72 82,92 Z" fill="url(#guest-silhouette)" />
  </g>
</svg>
