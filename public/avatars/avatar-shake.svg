<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg-shake" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="shake-liquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#bg-shake)" />
  <circle cx="50" cy="50" r="45" fill="#F0FDFA" />
  <!-- Glass Cup -->
  <polygon points="32,42 68,42 62,86 38,86" fill="url(#shake-liquid)" opacity="0.9" />
  <polygon points="30,40 70,40 64,88 36,88" fill="none" stroke="#67E8F9" stroke-width="2" />
  <!-- Whipped Cream Dome -->
  <path d="M30,40 C30,22 70,22 70,40 Z" fill="#FFFFFF" />
  <path d="M40,32 C40,24 60,24 60,32 Z" fill="#F8FAFC" />
  <path d="M45,26 C45,20 55,20 55,26 Z" fill="#FFFFFF" />
  <!-- Cherry -->
  <circle cx="50" cy="18" r="4.5" fill="#DC2626" />
  <path d="M52,15 Q56,8 60,11" fill="none" stroke="#15803D" stroke-width="1.5" stroke-linecap="round" />
  <!-- Straw -->
  <line x1="62" y1="12" x2="48" y2="52" stroke="#EF4444" stroke-width="3.5" stroke-linecap="round" />
  <line x1="62" y1="12" x2="48" y2="52" stroke="#FFFFFF" stroke-width="3.5" stroke-dasharray="3 3" stroke-linecap="round" />
  <!-- Face on Cup -->
  <circle cx="45" cy="58" r="2.5" fill="#FFFFFF" />
  <circle cx="55" cy="58" r="2.5" fill="#FFFFFF" />
  <path d="M48,64 Q50,67 52,64" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="41" cy="62" r="1.5" fill="#FBCFE8" />
  <circle cx="59" cy="62" r="1.5" fill="#FBCFE8" />
</svg>
