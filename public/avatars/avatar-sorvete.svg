<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg-sorvete" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9306CF" />
      <stop offset="100%" stop-color="#940068" />
    </linearGradient>
    <linearGradient id="cone-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="cream-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDF2F8" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#bg-sorvete)" />
  <circle cx="50" cy="50" r="45" fill="#FAF5FF" />
  <!-- Cone -->
  <polygon points="35,55 65,55 50,88" fill="url(#cone-grad)" stroke="#B45309" stroke-width="1.5" stroke-linejoin="round" />
  <line x1="39" y1="62" x2="61" y2="62" stroke="#B45309" stroke-width="1" opacity="0.6" />
  <line x1="43" y1="71" x2="57" y2="71" stroke="#B45309" stroke-width="1" opacity="0.6" />
  <line x1="47" y1="80" x2="53" y2="80" stroke="#B45309" stroke-width="1" opacity="0.6" />
  <!-- Scoop 1 (Base) -->
  <path d="M30,55 C30,42 70,42 70,55 C70,58 65,60 60,57 C55,60 45,60 40,57 C35,60 30,58 30,55 Z" fill="#A855F7" />
  <!-- Scoop 2 (Top Swirl) -->
  <circle cx="50" cy="40" r="18" fill="url(#cream-grad)" />
  <circle cx="43" cy="38" r="2.5" fill="#1F2937" />
  <circle cx="57" cy="38" r="2.5" fill="#1F2937" />
  <path d="M47,44 Q50,47 53,44" fill="none" stroke="#1F2937" stroke-width="1.5" stroke-linecap="round" />
  <!-- Cheek blush -->
  <circle cx="39" cy="43" r="2" fill="#F43F5E" opacity="0.5" />
  <circle cx="61" cy="43" r="2" fill="#F43F5E" opacity="0.5" />
  <!-- Cherry on top -->
  <circle cx="50" cy="21" r="5" fill="#E11D48" />
  <path d="M52,18 Q58,11 63,13" fill="none" stroke="#059669" stroke-width="1.5" stroke-linecap="round" />
  <!-- Sprinkles -->
  <rect x="36" y="30" width="3" height="1.5" rx="0.75" fill="#F59E0B" transform="rotate(25 36 30)" />
  <rect x="58" y="28" width="3" height="1.5" rx="0.75" fill="#10B981" transform="rotate(-30 58 28)" />
</svg>
