services:
  postgres:
    image: postgres:16-alpine
    container_name: popclub_local_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: popclub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - popclub_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d popclub"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  popclub_local_data:
    name: popclub_local_data
